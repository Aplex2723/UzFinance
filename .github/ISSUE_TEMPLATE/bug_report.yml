name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real financial data** (statements, card digits, names, tokens). Redact or invent samples.
        Security issues: don't file them here, see SECURITY.md.
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Minimal steps; use the seeded demo data when possible }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options: [Local (Docker), Azure App Service, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit or version, placeholder: "e.g. a8525bf" }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs / screenshots (redacted), render: text }
