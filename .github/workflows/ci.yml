name: CI

on:
  pull_request:
  workflow_call: # lo reutiliza deploy.yml (push a main)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_SERVER: localhost
      DB_PORT: "1433"
      DB_USER: sa
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # SQL Server efímero con password aleatorio (nada de secretos en el repo).
      - name: Start SQL Server
        run: |
          PW="Uz$(openssl rand -hex 12)!Aa1"
          echo "::add-mask::$PW"
          echo "DB_PASSWORD=$PW" >> "$GITHUB_ENV"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$PW" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" -Q "SELECT 1" -b -o /dev/null && exit 0
            sleep 3
          done
          docker logs sql | tail -30
          exit 1

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (API + SQL Server)
        run: npm run test:integration
      - run: npm run build
      - name: Verificar que el paquete trae el OCR
        run: node scripts/check-standalone.mjs
      # Los e2e (Playwright) no corren aquí para mantener el pipeline rápido.
      # Corren en local: `npm run test:e2e`.
