name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Solo despliega si el repo tiene configuradas las variables de Azure (Settings → Variables → Actions).
    # En un fork o en un clon sin ellas, el job se omite y solo corre el CI.
    if: ${{ vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # OIDC hacia Entra: sin secretos de larga duración
      contents: read
    env:
      APP_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verificar que el paquete trae el OCR
        run: node scripts/check-standalone.mjs

      - name: Empaquetar (standalone + estáticos)
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && zip -qr ../../app.zip .)
          ls -lh app.zip

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar
        run: |
          az webapp deploy -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path app.zip --type zip --clean true --restart true

      - name: Smoke test
        run: |
          # El token se lee en tiempo de ejecución (no vive en GitHub) y se enmascara.
          TOKEN=$(az webapp config appsettings list -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query "[?name=='INGEST_TOKEN'].value | [0]" -o tsv)
          echo "::add-mask::$TOKEN"
          bash scripts/smoke.sh "$APP_URL" "$TOKEN"
