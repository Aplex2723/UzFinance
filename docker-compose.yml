# SQL Server 2022 local: mismo motor que Azure SQL Database (paridad de T-SQL).
# En Apple Silicon corre emulado x86 (Rosetta en OrbStack/Docker Desktop).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?define DB_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:1433:1433" # solo loopback, nunca expuesto a la red
    volumes:
      - uzfinance-db:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  uzfinance-db:
